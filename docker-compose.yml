services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # The bundled database still requires an explicit password. Deployments
    # using an externally managed DATABASE_URL do not use this service and
    # should configure their database directly rather than relying on a weak
    # compose default.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-change_mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-change_mgmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the bundled database}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-change_mgmt} -d ${POSTGRES_DB:-change_mgmt}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-change_mgmt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-change_mgmt}}
    command: ["pnpm", "--filter", "@workspace/db", "run", "push"]
    restart: "no"

  api:
    build:
      context: .
      target: api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Secrets are required explicitly. The entrypoint may load an existing JWT
    # compatibility file, but never creates or rotates secrets implicitly.
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      SESSION_SECRET: ${SESSION_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-change_mgmt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-change_mgmt}}
      # Optional AD FS/OIDC deployment fallbacks. Keep these on the API
      # container only: the web image and browser must never receive the
      # client secret or internal CA material.
      ADFS_ENABLED: ${ADFS_ENABLED:-false}
      ADFS_DISPLAY_NAME: ${ADFS_DISPLAY_NAME:-Sign in with AD FS}
      ADFS_ISSUER: ${ADFS_ISSUER:-}
      ADFS_DISCOVERY_URL: ${ADFS_DISCOVERY_URL:-}
      ADFS_CLIENT_ID: ${ADFS_CLIENT_ID:-}
      ADFS_CLIENT_SECRET: ${ADFS_CLIENT_SECRET:-}
      ADFS_REDIRECT_URI: ${ADFS_REDIRECT_URI:-}
      ADFS_SCOPES: ${ADFS_SCOPES:-openid profile email}
      ADFS_USERNAME_CLAIM: ${ADFS_USERNAME_CLAIM:-upn}
      ADFS_EMAIL_CLAIM: ${ADFS_EMAIL_CLAIM:-email}
      ADFS_DISPLAY_NAME_CLAIM: ${ADFS_DISPLAY_NAME_CLAIM:-name}
      ADFS_CA_CERT_PEM: ${ADFS_CA_CERT_PEM:-}
    volumes:
      - api_secrets:/var/secrets
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    environment:
      DISABLE_TLS: ${DISABLE_TLS:-false}
      TLS_HOSTNAME: ${TLS_HOSTNAME:-change-mgmt.local}
      TLS_SELFSIGNED_DAYS: ${TLS_SELFSIGNED_DAYS:-365}
      # Lets the web entrypoint pull the user-uploaded TLS cert/key from
      # ssl_settings on every container start, so re-uploading via the
      # SSL Settings UI takes effect after a simple restart.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-change_mgmt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-change_mgmt}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs
    restart: unless-stopped

volumes:
  db_data:
  api_secrets:
