name: Build and publish container images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:

# Hosted runners publish to GHCR and export archives; Nexus remains private.

permissions:
  contents: read

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate package versions and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          api_version="$(node -p "require('./artifacts/api-server/package.json').version")"
          web_version="$(node -p "require('./artifacts/change-mgmt/package.json').version")"
          if [[ -z "${api_version}" || -z "${web_version}" ]]; then
            echo "::error::Could not read both package versions." >&2
            exit 1
          fi
          if [[ "${api_version}" != "${web_version}" ]]; then
            echo "::error::API (${api_version}) and web (${web_version}) package versions differ." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            # Accept canonical SemVer core and prerelease identifiers, but
            # reject build metadata: '+' cannot be represented by the Docker
            # image tag emitted below. Numeric identifiers may not have
            # leading zeroes, and empty/doubled prerelease components fail.
            semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
            if [[ "${version}" == *"+"* ]]; then
              echo "::error::Release tag '${tag}' uses SemVer build metadata; '+' is rejected because it is not compatible with the Docker image tag. Use vX.Y.Z[-prerelease] without '+build'." >&2
              exit 1
            fi
            if [[ ! "${version}" =~ ${semver_regex} ]]; then
              echo "::error::Release tag '${tag}' is not canonical SemVer (use vX.Y.Z or X.Y.Z with an optional valid prerelease; no build metadata)." >&2
              exit 1
            fi
            if (( ${#version} > 128 )); then
              echo "::error::Release tag '${tag}' is too long for a Docker image tag (maximum 128 characters)." >&2
              exit 1
            fi
            if [[ "${version}" != "${api_version}" || "${version}" != "${web_version}" ]]; then
              echo "::error::Release tag '${tag}' does not match both package.json versions (${api_version})." >&2
              exit 1
            fi
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "is_release=true" >> "${GITHUB_OUTPUT}"
            echo "Validated release ${version} against both package manifests."
          else
            echo "version=" >> "${GITHUB_OUTPUT}"
            echo "is_release=false" >> "${GITHUB_OUTPUT}"
            echo "Validated main build at package version ${api_version}."
          fi

  archive:
    name: Publish ${{ matrix.image }} image
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: builder
            image: migrate
          - target: api
            image: api
          - target: web
            image: web
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve GHCR namespace
        id: registry
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ steps.registry.outputs.namespace }}/change-manager-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.validate.outputs.version }},enable=${{ needs.validate.outputs.is_release == 'true' }}
            type=sha,prefix=sha-,format=long

      - name: Prepare archive directory
        run: mkdir -p "${RUNNER_TEMP}/images"

      - name: Build and export ${{ matrix.target }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/images/change-manager-${{ matrix.image }}.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish exported image to GHCR
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker load -i "${RUNNER_TEMP}/images/change-manager-${IMAGE}.tar"
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            docker push "${tag}"
            echo "Published \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${IMAGE_TAGS}"

      - name: Compress and checksum archive
        env:
          TARGET: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/images"
          gzip -1 "change-manager-${TARGET}.tar"
          sha256sum "change-manager-${TARGET}.tar.gz" > SHA256SUMS
          printf 'Commit: %s\nTarget: %s\nPlatform: linux/amd64\n' \
            "${GITHUB_SHA}" "${TARGET}" > BUILD-INFO.txt
          echo "Download this job's artifact, unzip it, verify with \`sha256sum -c SHA256SUMS\`, then load with \`docker load -i change-manager-${TARGET}.tar.gz\`." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change-manager-${{ matrix.image }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0